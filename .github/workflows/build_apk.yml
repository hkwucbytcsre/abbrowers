name: 'Build Kiwi Reborn APK'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout your patches
        uses: actions/checkout@v4
        with:
          ref: afterbird
          path: .

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      # ---- 以下两步硬编码版本，不再读取 CHROMIUM_VERSION ----
      - name: Set Chromium version
        id: ver
        run: |
          echo "version=151.0.7922.38" >> $GITHUB_OUTPUT
          echo "major=151" >> $GITHUB_OUTPUT

      - name: Configure gclient for Android
        run: |
          mkdir chromium && cd chromium
          gclient config --name=src \
            https://chromium.googlesource.com/chromium/src.git \
            --unmanaged
          echo "target_os = ['android']" >> .gclient

      - name: Fetch Chromium at pinned version
        run: |
          cd chromium
          gclient sync \
            --no-history \
            --nohooks \
            --revision=src@${{ steps.ver.outputs.version }} \
            -D

      - name: Apply Kiwi patches
        run: |
          cd chromium/src
          # 硬编码补丁目录为 m151（因为版本固定为151）
          LOCAL_PATCH_DIR="$GITHUB_WORKSPACE/patches/m151"
          if [ -d "$LOCAL_PATCH_DIR" ] && [ -n "$(ls -A "$LOCAL_PATCH_DIR"/*.patch 2>/dev/null)" ]; then
            echo "Using local patches from $LOCAL_PATCH_DIR"
            cp "$LOCAL_PATCH_DIR"/*.patch .
          else
            echo "Local patches not found, downloading from GitHub via wget..."
            # 直接下载到当前目录（chromium/src）
            wget -q https://raw.githubusercontent.com/hkwucbytcsre/abbrowers/refs/heads/afterbird/patches/m151/0001-mv2-reenable.patch || exit 1
            wget -q https://raw.githubusercontent.com/hkwucbytcsre/abbrowers/refs/heads/afterbird/patches/m151/0002-browseraction-schema-desktop-android.patch || exit 1
            wget -q https://raw.githubusercontent.com/hkwucbytcsre/abbrowers/refs/heads/afterbird/patches/m151/0003-extensions-menu-null-coordinator-fallback.patch || exit 1
            wget -q https://raw.githubusercontent.com/hkwucbytcsre/abbrowers/refs/heads/afterbird/patches/m151/0004-allow-unpacked-without-devmode.patch || exit 1
            wget -q https://raw.githubusercontent.com/hkwucbytcsre/abbrowers/refs/heads/afterbird/patches/m151/0005-webstore-desktop-user-agent.patch || exit 1
          fi
          # 应用所有 .patch 文件
          for patch in ./*.patch; do
            echo "Applying $patch"
            patch -p1 < "$patch" || exit 1
          done

      - name: Run gclient hooks
        run: |
          cd chromium
          gclient runhooks

      - name: Install Android build dependencies
        run: |
          cd chromium/src
          sudo ./build/install-build-deps.sh --android --no-prompt

      - name: Generate build files (arm64)
        run: |
          cd chromium/src
          ARGS="target_os=\"android\" target_cpu=\"arm64\" is_debug=false is_component_build=false $(cat ../../../.build/args/release.gn)"
          gn gen out/arm64 --args="$ARGS"

      - name: Compile APK
        run: |
          cd chromium/src
          autoninja -C out/arm64 chrome_public_apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-reborn-arm64
          path: chromium/src/out/arm64/apks/ChromePublic.apk
          retention-days: 7