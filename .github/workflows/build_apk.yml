name: 'Build Kiwi Reborn APK'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout your patches
        uses: actions/checkout@v4
        with:
          ref: afterbird
          path: .

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Set Chromium version
        id: ver
        run: |
          echo "version=151.0.7922.38" >> $GITHUB_OUTPUT
          echo "major=151" >> $GITHUB_OUTPUT

      # ---------- 缓存 depot_tools 和 ccache ----------
      - name: Cache depot_tools
        uses: actions/cache@v3
        with:
          path: $HOME/depot_tools
          key: depot-tools-${{ runner.os }}

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ steps.ver.outputs.version }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.ver.outputs.version }}-

      # ---------- 下载之前保存的编译中间产物（Artifact，仅含 gen 和元数据） ----------
      - name: Download previous partial build (if exists)
        id: download-artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: partial-build
          path: chromium/src/out/arm64/

      - name: Extract partial build (if downloaded)
        if: steps.download-artifact.outcome == 'success'
        run: |
          cd chromium/src/out/arm64
          if [ -f partial_build.tar.gz ]; then
            gunzip -c partial_build.tar.gz | tar -xf -
            rm -f partial_build.tar.gz
            echo "Extraction completed. Contents:"
            ls -la
          else
            echo "No partial build archive found."
          fi

      - name: Configure gclient for Android
        run: |
          mkdir chromium && cd chromium
          gclient config --name=src \
            https://chromium.googlesource.com/chromium/src.git \
            --unmanaged
          echo "target_os = ['android']" >> .gclient

      - name: Fetch Chromium at pinned version
        run: |
          cd chromium
          gclient sync \
            --no-history \
            --nohooks \
            --revision=src@${{ steps.ver.outputs.version }} \
            -D

      - name: Apply Kiwi patches
        run: |
          cd chromium/src
          LOCAL_PATCH_DIR="$GITHUB_WORKSPACE/patches/m151"
          if [ -d "$LOCAL_PATCH_DIR" ] && [ -n "$(ls -A "$LOCAL_PATCH_DIR"/*.patch 2>/dev/null)" ]; then
            echo "Using local patches from $LOCAL_PATCH_DIR"
            cp "$LOCAL_PATCH_DIR"/*.patch .
          else
            echo "Local patches not found, downloading from GitHub via wget..."
            wget -q https://raw.githubusercontent.com/hkwucbytcsre/abbrowers/refs/heads/afterbird/patches/m151/0001-mv2-reenable.patch || exit 1
            wget -q https://raw.githubusercontent.com/hkwucbytcsre/abbrowers/refs/heads/afterbird/patches/m151/0002-browseraction-schema-desktop-android.patch || exit 1
            wget -q https://raw.githubusercontent.com/hkwucbytcsre/abbrowers/refs/heads/afterbird/patches/m151/0003-extensions-menu-null-coordinator-fallback.patch || exit 1
            wget -q https://raw.githubusercontent.com/hkwucbytcsre/abbrowers/refs/heads/afterbird/patches/m151/0004-allow-unpacked-without-devmode.patch || exit 1
            wget -q https://raw.githubusercontent.com/hkwucbytcsre/abbrowers/refs/heads/afterbird/patches/m151/0005-webstore-desktop-user-agent.patch || exit 1
          fi
          # 应用补丁：对 0004 使用 git apply，其余用 patch -p1
          for patch in ./*.patch; do
            echo "Applying $patch"
            if [[ "$patch" == *"0004-allow-unpacked-without-devmode.patch"* ]]; then
              git apply --verbose "$patch" || exit 1
            else
              patch -p1 < "$patch" || exit 1
            fi
          done

      - name: Run gclient hooks
        run: |
          cd chromium
          gclient runhooks

      - name: Install Android build dependencies
        run: |
          cd chromium/src
          sudo ./build/install-build-deps.sh --android --no-prompt

      - name: Generate build files (arm64) with ccache
        run: |
          cd chromium/src
          export PATH="/usr/lib/ccache:$PATH"
          ARGS="target_os=\"android\" target_cpu=\"arm64\" is_debug=false is_component_build=false compiler_prefix=\"ccache\" $(cat $GITHUB_WORKSPACE/.build/args/release.gn)"
          gn gen out/arm64 --args="$ARGS"

      # ---------- 编译步骤（动态超时，确保预留保存时间） ----------
      - name: Compile APK (with dynamic timeout)
        id: compile
        run: |
          cd chromium/src
          export PATH="/usr/lib/ccache:$PATH"

          # 获取作业开始时间（Unix 时间戳）
          JOB_START=$(date -d "${{ github.run_started_at }}" +%s)
          CURRENT=$(date +%s)
          ELAPSED=$((CURRENT - JOB_START))
          # 作业总超时 360 分钟（21600 秒）
          TOTAL_TIMEOUT=21600
          # 预留 30 分钟（1800 秒）用于保存产物
          RESERVE=1800
          # 计算编译可用的最大时间（剩余时间 - 预留时间）
          REMAINING=$((TOTAL_TIMEOUT - ELAPSED - RESERVE))
          if [ $REMAINING -le 0 ]; then
            echo "Not enough time left to compile and save. Exiting."
            exit 1
          fi
          echo "Compilation timeout set to ${REMAINING} seconds ($((REMAINING / 60)) minutes)."

          timeout ${REMAINING}s autoninja -C out/arm64 chrome_public_apk
          code=$?
          if [ $code -eq 124 ]; then
            echo "TIMEOUT=true" >> $GITHUB_ENV
          elif [ $code -eq 0 ]; then
            echo "TIMEOUT=false" >> $GITHUB_ENV
          else
            echo "Build failed with code $code, not timeout."
            exit $code
          fi

      # ---------- 若超时，保存部分编译产物（仅 gen 和 Ninja 元数据） ----------
      - name: Save partial build (if timeout)
        if: env.TIMEOUT == 'true'
        run: |
          cd chromium/src/out/arm64
          # 只保存 gen 目录和 .ninja_* 文件（这些是增量编译的关键，且体积小）
          tar -czf partial_build.tar.gz gen .ninja_log .ninja_deps build.ninja
          echo "Partial build archive created:"
          ls -lh partial_build.tar.gz

      - name: Upload partial build (if timeout)
        if: env.TIMEOUT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: partial-build
          path: chromium/src/out/arm64/partial_build.tar.gz
          retention-days: 7

      # ---------- 若编译完成则上传 APK ----------
      - name: Upload APK as artifact
        if: env.TIMEOUT == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-reborn-arm64
          path: chromium/src/out/arm64/apks/ChromePublic.apk
          retention-days: 7
